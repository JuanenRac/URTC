# Type checks run by CI (mypy). The files copied from the family's shared set are not edited here and are left out.
[mypy]
files = tools, tests, bump.py, bump_version.py, check_shared_drivers.py, firmware_signing.py, generate_manifest.py
exclude = ^tools/(_readme_svg|make_architecture|make_structure)\.py$|^tools/image_record/
ignore_missing_imports = True
namespace_packages = True
explicit_package_bases = True
mypy_path = $MYPY_CONFIG_FILE_DIR/tools:$MYPY_CONFIG_FILE_DIR

# The tests load the tools by file path (importlib), where the loader is optional by the types but always present for a file that exists
[mypy-tests.*]
disable_error_code = union-attr, arg-type, assignment, misc
