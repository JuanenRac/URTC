# Started by hand only. It compiles and runs the C host suites of tools/run_host_tests.py (the firmware logic against a fake HAL) on a build machine, so a
# workstation does not have to. It holds no secret and changes nothing.
name: Host logic tests (manual)

on:
  workflow_dispatch:
    inputs:
      only:
        description: "Run only this suite (empty: all)"
        required: false
        default: ""
      coverage_floor:
        description: "Also build the suites with gcov counters and fail under this percentage of executed lines (empty: no measurement)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  host-tests:
    name: Compile and run the host suites
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run the host suites
        env:
          ONLY: ${{ inputs.only }}
          FLOOR: ${{ inputs.coverage_floor }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc cppcheck
          EXTRA=""
          if [ -n "$FLOOR" ]; then
            EXTRA="--coverage-floor $FLOOR"
          fi
          if [ -n "$ONLY" ]; then
            python tools/run_host_tests.py --runner direct --no-analyze $EXTRA --only "$ONLY"
          else
            python tools/run_host_tests.py --runner direct --no-analyze $EXTRA
          fi
