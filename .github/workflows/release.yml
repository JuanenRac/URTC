# =============================================================================
# This workflow signs nothing and builds nothing, and it holds no key. The firmware is built and
# signed on the maintainer's machine (docs/RELEASE_SIGNING.md); the signed files are uploaded as an
# unpublished draft release of the tag. This workflow then downloads the draft's files, checks every
# digest and every signature against the PUBLIC key of keys/registry.json (which must be the key
# pinned in tools/release_sign.py) and, only when all of it verifies, publishes a release made from
# the verified files. Anything that does not verify stops the run and nothing is published.
# Nothing here runs on its own: it is started by hand, it can only run from main, and the job
# waits for the approval that the `release` environment requires.
#
# Needs no secret for the verification. Optional, as a repository secret: URTC_DISPATCH_TOKEN, a
# token that may send a repository_dispatch event to URTC-FLASHER and URTC-WEB-STUDIO. When it
# exists, the last step tells both repositories that a release was published (event type
# urtc-firmware-released); when it does not, the step is skipped with a notice.
# GitHub shows draft releases only to a token with write access to the contents, so the single job
# needs it; the draft's files are never trusted, they are verified and re-published as new files.
name: URTC firmware release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to publish; it must be v followed by the version of urtc.project.json (for example v0.3.9), and a draft release of that tag must hold the signed files"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: firmware-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify the signed files and publish the release
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    env:
      REQUESTED_TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check that the tag is the version of this commit and is not published yet
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 -c "import json; print(json.load(open('urtc.project.json'))['version'])")"
          if [ "${REQUESTED_TAG}" != "v${version}" ]; then
            echo "::error::The tag ${REQUESTED_TAG} is not v${version}, the version of urtc.project.json at this commit."
            exit 1
          fi
          if gh release view "${REQUESTED_TAG}" >/dev/null 2>&1; then
            echo "::error::A release ${REQUESTED_TAG} already exists; a published version is never replaced, raise the version first."
            exit 1
          fi
          python3 tools/changelog_section.py "${version}" --compat > "${RUNNER_TEMP}/notes.md"
      - name: Download the signed files from the draft release
        shell: bash
        run: |
          set -euo pipefail
          drafts="$(gh api "repos/${GH_REPO}/releases" --paginate --jq ".[] | select(.draft and .tag_name == \"${REQUESTED_TAG}\") | .id")"
          if [ "$(printf '%s\n' "${drafts}" | grep -c .)" != "1" ]; then
            echo "::error::Exactly one draft release of ${REQUESTED_TAG} must hold the signed files (docs/RELEASE_SIGNING.md); found: $(printf '%s\n' "${drafts}" | grep -c .)."
            exit 1
          fi
          echo "DRAFT_ID=${drafts}" >> "${GITHUB_ENV}"
          mkdir -p "${RUNNER_TEMP}/signed"
          gh api "repos/${GH_REPO}/releases/${drafts}" --jq '.assets[] | "\(.id) \(.name)"' > "${RUNNER_TEMP}/draft_assets.txt"
          if [ ! -s "${RUNNER_TEMP}/draft_assets.txt" ]; then
            echo "::error::The draft release of ${REQUESTED_TAG} has no files."
            exit 1
          fi
          while read -r id name; do
            case "${name}" in
              */*|*..*|"") echo "::error::Unexpected file name in the draft."; exit 1 ;;
            esac
            gh api -H "Accept: application/octet-stream" "repos/${GH_REPO}/releases/assets/${id}" > "${RUNNER_TEMP}/signed/${name}"
          done < "${RUNNER_TEMP}/draft_assets.txt"
      - name: Verify the digests and the signatures against the pinned public key
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/keys.py verify
          python3 tools/verify_release_set.py "${RUNNER_TEMP}/signed" --tag "${REQUESTED_TAG}" --list-file "${RUNNER_TEMP}/assets.txt"
      - name: Publish the release made from the verified files
        shell: bash
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/signed"
          mapfile -t assets < "${RUNNER_TEMP}/assets.txt"
          gh release create "${REQUESTED_TAG}" --target "${GITHUB_SHA}" --title "URTC ${REQUESTED_TAG}" --notes-file "${RUNNER_TEMP}/notes.md" --latest "${assets[@]}"
      - name: Check what was published
        shell: bash
        run: |
          set -euo pipefail
          check="${RUNNER_TEMP}/published"
          mkdir -p "${check}"
          gh release download "${REQUESTED_TAG}" --dir "${check}"
          python3 tools/verify_release_set.py "${check}" --tag "${REQUESTED_TAG}"
          echo "PUBLISHED_RELEASE=PASS"
      - name: Remove the draft that held the signed files
        shell: bash
        run: |
          set -euo pipefail
          gh api --method DELETE "repos/${GH_REPO}/releases/${DRAFT_ID}"
      - name: Tell the flasher and the web studio that a release was published (when a token is set)
        shell: bash
        env:
          URTC_DISPATCH_TOKEN: ${{ secrets.URTC_DISPATCH_TOKEN }}
        run: |
          set -uo pipefail
          # The token is optional: without it this step only says so and ends well, so the run
          # of the release never turns red because of a notification. Do not print the token.
          if [ -z "${URTC_DISPATCH_TOKEN:-}" ]; then
            echo "::notice::The secret URTC_DISPATCH_TOKEN is not set; URTC-FLASHER and URTC-WEB-STUDIO were not told about ${REQUESTED_TAG} (see docs/RELEASE_SIGNING.md)."
            exit 0
          fi
          payload="$(jq -nc --arg tag "${REQUESTED_TAG}" --arg sha "${GITHUB_SHA}" '{event_type: "urtc-firmware-released", client_payload: {tag: $tag, sha: $sha}}')"
          for target in URTC-FLASHER URTC-WEB-STUDIO; do
            if curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors                  --connect-timeout 10 --max-time 30                  --request POST                  --header "Accept: application/vnd.github+json"                  --header "Authorization: Bearer ${URTC_DISPATCH_TOKEN}"                  --header "X-GitHub-Api-Version: 2022-11-28"                  --url "https://api.github.com/repos/JuanenRac/${target}/dispatches"                  --data "${payload}"; then
              echo "${target} was told about ${REQUESTED_TAG}."
            else
              echo "::warning::${target} could not be told about ${REQUESTED_TAG}; the release itself is published."
            fi
          done
