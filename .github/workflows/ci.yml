name: URTC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate manifest, version, documentation and secret policy
        run: python tools/ci_validate.py
      - name: Check that every embedded public key is the registered one
        run: python tools/keys.py verify
      - name: Compile Python sources without running versioning build scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          excluded = {".git", ".venv", "node_modules", "dist", "build", "target", "__pycache__"}
          files = [path for path in Path(".").rglob("*.py") if not any(part in excluded for part in path.parts)]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"PYTHON_SYNTAX=PASS files={len(files)}")
          PY
      - name: Run build tooling tests
        run: |
          python -m pip install coverage
          python -m coverage run --source=tools -m unittest discover -s tests -p "test_*.py" -v
          python -m coverage report --fail-under=35
      - name: Install ARM GNU Toolchain for firmware projects
        if: ${{ hashFiles('build_firmware.sh') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib
      - name: Compile firmware without a version bump
        if: ${{ hashFiles('build_firmware.sh') != '' }}
        env:
          URTC_CI: "1"
          URTC_COVERAGE_FLOOR: "80"  # measured 88 percent of the firmware sources the host suites compile; the floor is eight points under
        shell: bash
        run: |
          chmod +x build_firmware.sh
          ./build_firmware.sh
      - name: Check that every version tag agrees
        if: ${{ hashFiles('check_version_consistency.sh') != '' }}
        shell: bash
        run: bash check_version_consistency.sh
