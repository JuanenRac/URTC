name: URTC CI baseline

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  baseline:
    name: Validate project baseline
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Validate manifest, version, documentation and secret policy
        run: python tools/ci_validate.py
      - name: Light build check (the stack and the files the full check needs; nothing is built)
        run: python tools/build_test.py --check
      - name: Static checks (unused names, exception chaining, syntax)
        run: |
          python -m pip install "ruff==0.17.1"
          ruff check .
      - name: Check that every embedded public key is the registered one
        run: python tools/keys.py verify
      - name: Compile Python sources without running versioning build scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import py_compile

          excluded = {".git", ".venv", "node_modules", "dist", "build", "target", "__pycache__"}
          files = [path for path in Path(".").rglob("*.py") if not any(part in excluded for part in path.parts)]
          for path in files:
              py_compile.compile(str(path), doraise=True)
          print(f"PYTHON_SYNTAX=PASS files={len(files)}")
          PY
      - name: Run build tooling tests
        run: |
          python -m pip install coverage
          python -m coverage run --source=tools --omit=tools/pretty_run.py,tools/universal_readme_check.py,tools/_readme_svg.py,tools/make_architecture.py,tools/make_structure.py -m unittest discover -s tests -p "test_*.py" -v
          python -m coverage report --fail-under=35
      - name: Simulation bench (the real receive path of the application and the real bootloader of the master, compiled for the host)
        env:
          URTC_CI: "1"
        run: |
          python tools/fuzz_virtual_board.py --extra 3000
          python tools/bootloader_twin.py --check
      - name: Install ARM GNU Toolchain for firmware projects
        if: ${{ hashFiles('build_firmware.sh') != '' }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cppcheck
      - name: Compile firmware without a version bump
        if: ${{ hashFiles('build_firmware.sh') != '' }}
        env:
          URTC_CI: "1"
          URTC_COVERAGE_FLOOR: "90"  # measured 95 percent of the lines of all the firmware sources; the floor is five points under
        shell: bash
        run: |
          chmod +x build_firmware.sh
          ./build_firmware.sh
      - name: Check that every version tag agrees
        if: ${{ hashFiles('check_version_consistency.sh') != '' }}
        shell: bash
        run: bash check_version_consistency.sh
