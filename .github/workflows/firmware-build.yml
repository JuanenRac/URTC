# =============================================================================
# Started by hand only (workflow_dispatch): it never runs on a push or a pull request. It compiles the four firmware
# components of this repository with build_firmware.sh in CI mode (URTC_CI=1: no version change, nothing tracked is touched),
# checks the images, and uploads them with SHA256SUMS and a build manifest as one artifact with a build-provenance attestation.
#
# It holds no key and signs nothing. The main bootloader holds a table of PUBLIC Ed25519 keys (keys/image_trust.json) and the images are
# signed afterwards, on the maintainer's machine (docs/RELEASE_SIGNING.md). The flavour input picks the table: "dev" (the default) is the bench
# table, whose seed is public (signing_key_kind "dev"); "release" is the official table, which stays closed (it trusts nobody and installs nothing)
# until the maintainer puts the public half of the image-signing key in keys/image_trust.json. A build whose bootloader does not hold exactly the
# table of its flavour fails. The size of the bootloaders is measured with arm-none-eabi-size and the build fails when one leaves less free space in
# its reserved region than the margin of tools/bootloader_size.json. The signed Ed25519 layer of a pre-release is added locally from this artifact. With dry_run on (the default) nothing but the artifact is made; with it off a DRAFT pre-release
# named v<version>-bench with the unsigned files is also prepared (its tag can never be the tag of release.yml).
# A failed build writes the Job Summary and opens (or updates) the issue "build-failed"; a later good build closes it.

name: Firmware build (manual)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build and check only, no draft pre-release"
        type: boolean
        required: true
        default: true
      ref:
        description: "Branch, tag or commit of this repository"
        type: string
        required: true
        default: main
      flavour:
        description: "Trust table of the bootloader: dev (bench, public key) or release (official, closed until the image key exists)"
        type: choice
        required: true
        default: dev
        options:
          - dev
          - release

permissions:
  contents: read

concurrency:
  group: firmware-build-${{ inputs.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan the build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
    steps:
      - name: Check the inputs
        shell: bash
        env:
          REF: ${{ inputs.ref }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::only the owner of the repository ($OWNER) may start this build, not $ACTOR"; exit 1; }
          [[ "$REF" =~ ^[A-Za-z0-9._/-]{1,100}$ ]] || { echo "::error::the ref has characters that a branch, tag or commit does not have"; exit 1; }

      - name: Check out this repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Make sure the commit belongs to the main branch
        shell: bash
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          # only code that is already in main is built: a branch or a fork commit that is not in main is refused
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || { echo "::error::the commit $(git rev-parse --short HEAD) is not part of the main branch; merge it first"; exit 1; }
          # the commit built is the one this run was started from (github.sha); the ref input can only confirm it, never choose another commit
          want="$(git rev-parse --verify --quiet "refs/remotes/origin/${REF}^{commit}" || git rev-parse --verify --quiet "refs/tags/${REF}^{commit}" || git rev-parse --verify --quiet "${REF}^{commit}" || true)"
          [ -n "$want" ] && [ "$want" = "$(git rev-parse HEAD)" ] || { echo "::error::the ref $REF is not the commit this run was started from ($(git rev-parse --short HEAD)); start the run from that ref"; exit 1; }

      - name: Work out the version and pin the commit
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          echo "version=$(python3 -c "import json; print(json.load(open('urtc.project.json', encoding='utf-8'))['version'])")" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build the four components
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the exact commit that was planned
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Make sure the build has no private key to take
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${URTC_SIGNING_KEY_FILE:-}" ] || [ -n "${URTC_RELEASE:-}" ]; then
            echo "::error::a signing key or a release mode is set in this job; a build made here must use the public development key"
            exit 1
          fi
          if compgen -G "signing_keys*.txt" >/dev/null; then
            echo "::error::a signing key file is in the repository"
            exit 1
          fi

      - name: Install the ARM GNU toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib cppcheck

      - name: Compile the firmware without a version bump
        env:
          URTC_CI: "1"
          URTC_COVERAGE_FLOOR: "90"
          URTC_RELEASE: ${{ inputs.flavour == 'release' && '1' || '0' }}
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build_firmware.sh
          ./build_firmware.sh
          arm-none-eabi-gcc --version | head -n 1 > build/toolchain.txt

      - name: Check the images and name the files
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          FLAVOUR: ${{ inputs.flavour }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          out = Path("build/firmware")
          index = json.loads((out / "firmware_manifest.json").read_text(encoding="utf-8"))
          components = index["components"]
          if set(components) != {"main_bootloader", "main_application", "slave_bootloader", "slave_application"}:
              sys.exit("::error::unexpected components: " + ", ".join(sorted(components)))
          if components["main_application"]["version_string"] != os.environ["VERSION"]:
              sys.exit("::error::the main application is " + components["main_application"]["version_string"] + ", urtc.project.json says " + os.environ["VERSION"] + " (raise the version BEFORE the build)")
          for key, component in components.items():
              image = out / component["files"]["bin"]["filename"]
              if not image.is_file():
                  sys.exit(f"::error::{image.name} was not made")
              if "_v" + component["version_string"] + "." not in image.name:
                  sys.exit(f"::error::{image.name} does not carry version {component['version_string']}")
              if key.endswith("_application"):
                  kind = json.loads((out / (image.name + ".manifest.json")).read_text(encoding="utf-8")).get("signing_key_kind")
                  if (kind == "dev") != (os.environ["FLAVOUR"] == "dev"):
                      sys.exit(f"::error::{image.name} has signing_key_kind {kind!r}, which is not the flavour {os.environ['FLAVOUR']!r} of this build")
          print("images ok:", ", ".join(c["files"]["bin"]["filename"] for c in components.values()))
          PY
          # the main bootloader must hold, at the fixed offset, exactly the trust table of the flavour (release: the closed table while the key does not exist)
          python3 tools/image_trust.py check build/firmware/URTC_MAIN_BOOTLOADER_v*.bin master "$FLAVOUR"
          mkdir -p out
          cp build/firmware/URTC_*.bin build/firmware/URTC_*.hex build/firmware/URTC_*.bin.sha256 build/firmware/URTC_*.bin.manifest.json build/firmware/firmware_manifest.json out/
          cp build/toolchain.txt out/toolchain.txt.tmp
          {
            echo "### URTC firmware $VERSION (flavour: $FLAVOUR)"
            (cd out && sha256sum URTC_*.bin | sed 's/^/- /')
            echo "- toolchain: \`$(cat build/toolchain.txt)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Measure the bootloaders
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/bootloader_size.py --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload the images
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parts
          path: |
            out/URTC_*
            out/firmware_manifest.json
            out/toolchain.txt.tmp
          if-no-files-found: error
          retention-days: 7

  collect:
    name: Collect, attest and prepare the draft
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      FLAVOUR: ${{ inputs.flavour }}
    steps:
      - name: Download the images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: parts
          path: files

      - name: Write SHA256SUMS and the build manifest
        shell: bash
        run: |
          set -euo pipefail
          cd files
          mv toolchain.txt.tmp /tmp/toolchain.txt
          sha256sum URTC_* firmware_manifest.json > SHA256SUMS
          python3 - <<'PY'
          import json, os
          files = []
          for line in open("SHA256SUMS", encoding="utf-8"):
              digest, name = line.strip().split("  ", 1)
              files.append({"name": name, "sha256": digest, "bytes": os.path.getsize(name)})
          json.dump({
              "schema": "urtc-build/1", "repository": os.environ["GITHUB_REPOSITORY"], "project": "urtc", "version": os.environ["VERSION"],
              "commit": os.environ["SHA"], "built_on": "github-actions", "run_id": os.environ["GITHUB_RUN_ID"],
              "run_url": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "toolchain": open("/tmp/toolchain.txt", encoding="utf-8").read().strip(), "signing_key_kind": os.environ["FLAVOUR"],
              "signed": False, "files": files,
          }, open("build-manifest.json", "w", encoding="utf-8"), indent=2)
          PY
          cat SHA256SUMS

      - name: Attest the provenance of the files
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            files/URTC_*
            files/firmware_manifest.json
            files/SHA256SUMS

      - name: Upload the build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-urtc-${{ needs.plan.outputs.version }}
          path: files/*
          if-no-files-found: error
          retention-days: 30

  draft:
    name: Prepare the draft release (needs the approval of the owner)
    if: ${{ !inputs.dry_run }}
    needs: [plan, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SHA: ${{ needs.plan.outputs.sha }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ACTOR: ${{ github.actor }}
      OWNER: ${{ github.repository_owner }}
      FLAVOUR: ${{ inputs.flavour }}
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware-urtc-${{ needs.plan.outputs.version }}
          path: files

      - name: Prepare the draft pre-release with the unsigned files
        shell: bash
        run: |
          set -euo pipefail
          [ "$ACTOR" = "$OWNER" ] || { echo "::error::only the owner may prepare a release"; exit 1; }
          tag="v$VERSION-bench"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::the release $tag already exists: raise the version before a new build"
            exit 1
          fi
          gh release create "$tag" files/* --draft --prerelease --target "$SHA" --title "URTC $VERSION (unsigned bench build)" \
            --notes "Unsigned build made by GitHub Actions (trust table: $FLAVOUR). Not an official release until it is signed on the maintainer's machine; do not install it on a board you care about."
          echo "- draft pre-release \`$tag\` prepared with the unsigned files" >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify the artifact as a stranger would
    needs: [plan, collect]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      attestations: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: firmware-urtc-${{ needs.plan.outputs.version }}
          path: build

      - name: Check hashes, manifest and attestation
        shell: bash
        run: |
          set -euo pipefail
          cd build
          sha256sum -c SHA256SUMS
          python3 - <<'PY'
          import json
          manifest = json.load(open("build-manifest.json", encoding="utf-8"))
          assert manifest["signed"] is False and manifest["signing_key_kind"] in ("dev", "release") and manifest["files"], "unexpected manifest"
          print("manifest ok:", manifest["project"], manifest["version"], len(manifest["files"]), "files")
          PY
          for file in URTC_* firmware_manifest.json SHA256SUMS; do
            gh attestation verify "$file" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/firmware-build.yml" --source-digest "$GITHUB_SHA" >/dev/null
            echo "attestation ok: $file"
          done

  notify:
    name: Tell the owner (issue build-failed)
    if: ${{ always() }}
    needs: [plan, build, collect, draft, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      RESULTS: ${{ needs.plan.result }} ${{ needs.build.result }} ${{ needs.collect.result }} ${{ (inputs.dry_run && needs.draft.result == 'skipped') && 'success' || needs.draft.result }} ${{ needs.verify.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open, update or close the issue
        shell: bash
        run: |
          set -euo pipefail
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --label build-failed --state open --json number --jq '.[0].number // empty')"
          bad=""
          for r in $RESULTS; do [ "$r" = "success" ] || bad="$bad $r"; done
          if [ -n "$bad" ]; then
            body="The firmware build failed (plan / build / collect / verify: $RESULTS; anything but success counts as a failure: failure, timed out, cancelled or skipped). Run: $RUN_URL"
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh label create build-failed --repo "$GITHUB_REPOSITORY" --color B60205 --description "A build in GitHub Actions failed" 2>/dev/null || true
              gh issue create --repo "$GITHUB_REPOSITORY" --label build-failed --title "Firmware build failed" --body "$body"
            fi
            echo "### The build failed: issue build-failed updated" >> "$GITHUB_STEP_SUMMARY"
          elif [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "A later build passed: $RUN_URL"
          fi

      - name: The notice itself failed
        if: ${{ failure() }}
        shell: bash
        run: |
          echo "::error::The build did not pass (${RESULTS}) and the issue build-failed could not be written. Run: ${RUN_URL}"
          echo "### The build did not pass and the issue could not be written" >> "$GITHUB_STEP_SUMMARY"
          echo "Results: ${RESULTS}. Run: ${RUN_URL}" >> "$GITHUB_STEP_SUMMARY"
