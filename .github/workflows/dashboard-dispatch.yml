# Notifies the central JuanenRac dashboard only after the project CI finished
# green on main: a red or cancelled run never reaches the dashboard, and the
# commit that is announced is the one the CI actually checked. This workflow
# never changes, delays or invalidates the project CI. The same file is used
# by every repository of the ecosystem.

name: Notify central ecosystem dashboard

on:
  workflow_run:
    workflows:
      - URTC CI baseline
    types:
      - completed
    branches:
      - main

permissions: {}

jobs:
  notify:
    name: Request dashboard refresh
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    env:
      DASHBOARD_DISPATCH_TOKEN: ${{ secrets.ECOSYSTEM_DASHBOARD_DISPATCH_TOKEN }}
      CHECKED_REPOSITORY: ${{ github.repository }}
      CHECKED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Dispatch public manifest refresh when configured
        shell: bash
        run: |
          set -euo pipefail

          # The secret is intentionally optional during staged rollout.
          # Do not print it or add it to a command line.
          if [[ -z "${DASHBOARD_DISPATCH_TOKEN:-}" ]]; then
            echo "Dashboard dispatch is not configured for this repository; skipping."
            exit 0
          fi

          payload="$(jq -nc \
            --arg repository "${CHECKED_REPOSITORY}" \
            --arg ref "refs/heads/main" \
            --arg sha "${CHECKED_SHA}" \
            '{event_type: "ecosystem_project_updated", client_payload: {repository: $repository, ref: $ref, sha: $sha}}')"

          curl --fail-with-body --retry 3 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DASHBOARD_DISPATCH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --url "https://api.github.com/repos/JuanenRac/JuanenRac/dispatches" \
            --data "${payload}"

          echo "Dashboard refresh requested for ${CHECKED_REPOSITORY} at ${CHECKED_SHA}."
